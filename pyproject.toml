[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harcompanon"
description = "Compare how different LLMs behave as testing companions (RST) given the same evidence and prompt."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nermin Caluk" }]
keywords = ["rst", "rapid-software-testing", "llm", "testing-companion", "har", "benchmark"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=0.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
]
# Optional, exploratory: route all providers through LiteLLM instead of the vendor SDKs.
# Not needed for normal use — see docs/litellm-backend.md. Install with: pip install -e ".[litellm]"
litellm = [
    "litellm>=1.40",
]

[project.urls]
Homepage = "https://github.com/caluk/harcompanon"
Repository = "https://github.com/caluk/harcompanon"

[project.scripts]
harcompanon = "harcompanon.cli:app"

[tool.hatch.version]
path = "src/harcompanon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harcompanon"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Beans issue files are machine-owned markdown; keep ruff (which formats Python code
# blocks inside .md) away from them so a generated bean can never fail CI.
extend-exclude = [".beans"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# LiteLLM is an optional, untyped extra; don't fail the strict gate when it isn't installed.
[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
